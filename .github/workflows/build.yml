name: Build ColorCube

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: vitasdk/vitasdk:2026.08

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install vita2d
        run: |
          vdpm install libvita2d

      - name: Configure
        run: |
          cmake -S . -B build

      - name: Build VPK
        run: |
          cmake --build build --parallel 2

      - name: Upload VPK
        uses: actions/upload-artifact@v4
        with:
          name: ColorCube-VPK
          path: build/ColorCube.vpk
          if-no-files-found: error