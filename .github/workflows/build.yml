name: Build ColorCube

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: vitasdk/vitasdk:2026.08

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check VitaSDK and shader compiler
        run: |
          echo "VITASDK=$VITASDK"
          echo "PSP2CGC=$PSP2CGC"
          command -v psp2cgc || true
          if [ -n "$PSP2CGC" ]; then
            test -x "$PSP2CGC" && echo "PSP2CGC executable"
          fi

      - name: Build VPK
        run: |
          cmake -S . -B build
          cmake --build build --parallel 2

      - name: Upload VPK
        uses: actions/upload-artifact@v4
        with:
          name: ColorCube-VPK
          path: build/ColorCube.vpk
          if-no-files-found: error