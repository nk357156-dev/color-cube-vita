name: Build ColorCube

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:2026.08

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate GXM shader compiler
        run: |
          echo "VITASDK=$VITASDK"
          echo "PATH=$PATH"

          echo "=== Search in PATH ==="
          command -v psp2cgc || true

          echo "=== Search in VitaSDK ==="
          find "$VITASDK" -type f \
            \( -name 'psp2cgc' -o -name 'cgc' \) \
            -print 2>/dev/null || true

          echo "=== Check environment ==="
          env | grep -Ei 'PSP2CGC|CGC|VITASDK' || true

      - name: Build VPK
        run: |
          if ! command -v psp2cgc >/dev/null 2>&1 && [ -z "$PSP2CGC" ]; then
            echo "ERROR: psp2cgc is not available."
            echo "GXM shader compilation cannot proceed yet."
            exit 1
          fi

          cmake -S . -B build
          cmake --build build --parallel 2

      - name: Upload VPK
        uses: actions/upload-artifact@v4
        with:
          name: ColorCube-VPK
          path: build/ColorCube.vpk
          if-no-files-found: error